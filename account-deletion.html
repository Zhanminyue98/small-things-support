<h1>删除账户与数据</h1><div class="card"><ol><li>打开小事托管所，进入右上角“设置”。</li><li>在“账户与同步”中选择“删除云端账户及数据”。</li><li>阅读提示并确认永久删除。</li></ol></div>
<p>完成后，内部账户、云端同步快照以及这台设备上的事项、冷静期、会话和积分会被删除，且无法恢复。Apple 登录会同时尝试撤销相关服务令牌。</p>
<p>如果无法打开 App，可通过 <a href="mailto:1270440631@qq.com">1270440631@qq.com</a> 联系我们。我们可能要求进行与账户相称的身份验证，但不会要求不必要的电话或线下流程。</p>
